name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: redsis
          POSTGRES_PASSWORD: redsis
          POSTGRES_DB: redsis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redsis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://redsis:redsis@localhost:5432/redsis_test?schema=public
      JWT_SECRET: integracion-continua-secret-integracion-continua
      REFRESH_TOKEN_SECRET: integracion-continua-refresh-integracion-continua

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Aplicar migraciones
        run: pnpm db:deploy

      - name: Formato
        run: pnpm format:check

      - name: Análisis estático
        run: pnpm lint

      - name: Verificación de tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
