server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre no cambian nunca: se cachean de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se cachea, para que un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # La aplicación es de una sola página: cualquier ruta desconocida
    # la resuelve el router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
