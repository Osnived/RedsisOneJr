name: redsis-one-jr

services:
  postgres:
    image: postgres:17-alpine
    container_name: redsis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redsis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redsis}
      POSTGRES_DB: ${POSTGRES_DB:-redsis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-redsis} -d ${POSTGRES_DB:-redsis}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redsis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: redsis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-redsis}:${POSTGRES_PASSWORD:-redsis}@postgres:5432/${POSTGRES_DB:-redsis}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET es obligatorio}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - redsis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite incrusta las variables en el bundle: deben existir al construir.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: redsis-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'
    networks:
      - redsis

volumes:
  postgres-data:

networks:
  redsis:
    driver: bridge
