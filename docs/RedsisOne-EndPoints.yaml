          - columnId: ffb45037-ee59-4738-ab1e-80d9ec180da9
            value: Subcategory3
          - columnId: 2493d64f-abc8-45a1-b7f3-4ce350dae573
            value: Subcategory4
    insert_item_by_board_id:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
              value:
                type: string
      example:
        groupId: d920ad75-8da6-45ef-8615-6d3e97499f81
        title: INC2904642
        values:
          - columnId: 3826159b-ca77-43e8-a9f4-3d059c65ca85
            value: '2026-07-24T00:17:13.000Z'
          - columnId: ef75ca5e-0c99-4e64-899f-630c9d15ae40
            value: new
          - columnId: 5d73048d-3dcf-4b8b-801e-0058c207331b
