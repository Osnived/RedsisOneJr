# Documentación de referencia de la API de RedsisOne / OneBoards.
#
# Este archivo es una exportación de Bruno y sirve para diseñar el Provider de
# RedsisOne sin inventar endpoints ni formas de autenticación.
#
# NO CONTIENE CREDENCIALES. El token de ejemplo se sustituyó por un marcador:
# la exportación original traía uno real repetido quince veces.
#
# Las credenciales de un proveedor viven cifradas en la base de datos y se
# administran desde Configuración; nunca en un archivo del repositorio, nunca en
# el frontend (ver AGENTS.md y STACK.md). Al reexportar desde Bruno hay que volver
# a sustituir el token antes de guardar.
