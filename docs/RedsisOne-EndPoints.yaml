            value: >-
              Datos de contacto: ALIGHIERI RAMIREZ Tel: 5510999597 Horario: 8-16
              Ubicación del equipo (# caja): panaderia Falla del equipo:
              Panaderia, linea blanca en la impresion Modelo del CPU donde está
              conectado: Marca del CPU donde está conectado: Serie del CPU donde
              está conectado: Equipo roto o sin partes: NO Parte rota: -
