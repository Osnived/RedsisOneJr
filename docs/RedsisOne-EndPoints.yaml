components:
  schemas:
    create_item_portal_tickets:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
              value:
                type: string
      example:
        groupId: '{{Group_Id}}'
        title: Esto es una prueba {{Contador}}
        values:
          - columnId: '{{Descripcion}}'
            value: Esto es una prueba
          - columnId: 18de67e0-b0a9-4be5-90c9-b23729fed107
            value: Cancelled
          - columnId: 170f93c2-6eee-4c62-853c-a1cc8f90a1fb
            value: '2026-07-01T07:00:00Z'
    insert_body_item:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
              value:
                type: integer
      example:
        groupId: '{{Group_Id}}'
        title: Esto es una prueba {{Contador}}
        values:
          - columnId: '{{Location}}'
            value: 25
          - columnId: '{{Descripcion}}'
            value: Esto es una prueba
    insert_item_by_board_id_subitem:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
              value:
                type: string
      example:
        groupId: '{{Group_Id}}'
        title: INC
        values:
          - columnId: 94849b40-2da1-49ba-94bf-e286abdc7155
            value: New
          - columnId: 2e979261-ebb6-4c5b-8a01-b89a0b001f69
            value: Descrip. Corta
          - columnId: 0d09fd0d-47ab-4a06-8b52-bba5ca8ab663
            value: Descripcion
