packages:
  - 'apps/*'
  - 'packages/*'

# Dependencias autorizadas a ejecutar scripts de instalación.
# @scarf/scarf es telemetría y se mantiene deshabilitado.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.5'
  - lucide-react@1.28.0
  - vite@8.2.0
